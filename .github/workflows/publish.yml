name: Publish
# Publishes to npm when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# Uses npm Trusted Publishing (OIDC): no token is stored. Configure it once on npmjs.com:
# package → Settings → Trusted Publisher → GitHub Actions (owner reachdevel, repo mimeforge, workflow publish.yml).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - name: Skip if this version is already on npm
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "mimeforge@$V" version >/dev/null 2>&1; then echo "published=true" >> "$GITHUB_OUTPUT"; echo "mimeforge@$V is already on npm, nothing to publish"; fi
      - run: npm publish
        if: steps.check.outputs.published != 'true'
